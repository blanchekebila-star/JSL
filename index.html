<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0015">
    <title>JSL VIOLET</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0015;
            --red: #9d50bb; /* Violet Néon */
            --red2: #6e48aa;
            --cyan: #e100ff; /* Rose Électrique */
            --w: #f5f0ff;
            --mu: #664488;
            --bd: rgba(157, 80, 187, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; background: var(--bg); font-family: 'Rajdhani', sans-serif; color: var(--w); overflow: hidden; position: fixed; inset: 0; }

        /* Écran d'accueil */
        #welcome { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; background: var(--bg); transition: opacity 0.5s; }
        .gl { position: absolute; inset: 0; background-image: linear-gradient(rgba(157, 80, 187, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(157, 80, 187, .07) 1px, transparent 1px); background-size: 55px 55px; animation: gS 7s linear infinite; }
        @keyframes gS { to { transform: translateY(55px); } }
        
        .wc { position: relative; text-align: center; z-index: 10; }
        .wtitle { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 8vw, 4rem); font-weight: 900; background: linear-gradient(135deg, #fff 0%, var(--cyan) 50%, var(--red) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .wbtn { font-family: 'Orbitron', sans-serif; font-size: .8rem; color: var(--w); border: 1px solid var(--red); padding: 15px 40px; background: transparent; cursor: pointer; }

        /* App Principale */
        #app { display: none; width: 100%; height: 100%; flex-direction: column; }
        #app.on { display: flex; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px; border-bottom: 1px solid var(--bd); }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 900; color: var(--cyan); }
        .addbtn { background: var(--red); border: none; color: #fff; padding: 8px 15px; border-radius: 4px; font-family: 'Orbitron'; font-size: 0.7rem; }

        .scroll { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .cwrap { width: 180px; height: 180px; position: relative; margin-bottom: 20px; }
        .cart { width: 100%; height: 100%; background: #1a002a; border-radius: 50%; display: flex; align-items:center; justify-content: center; border: 2px solid var(--red); box-shadow: 0 0 20px var(--bd); }
        
        .tinfo { text-align: center; margin-bottom: 20px; width: 100%; }
        .tname { font-family: 'Orbitron'; font-size: 1.1rem; color: var(--w); margin-bottom: 5px; }
        .tartist { color: var(--mu); font-size: 0.9rem; }

        /* Paroles */
        #lyricsDisplay { height: 80px; width: 100%; text-align: center; color: var(--cyan); font-style: italic; overflow-y: auto; margin-bottom: 20px; font-size: 0.9rem; }

        .ptrack { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; position: relative; }
        #pfill { height: 100%; background: var(--cyan); width: 0%; border-radius: 10px; }

        .ctrls { display: flex; gap: 30px; align-items: center; margin-top: 30px; }
        .pbtn { width: 60px; height: 60px; border-radius: 50%; background: var(--red); border: none; color: white; font-size: 1.5rem; }

        .plsec { width: 100%; margin-top: 40px; }
        .pli { padding: 15px; border-bottom: 1px solid var(--bd); display: flex; justify-content: space-between; }
        .pli:active { background: var(--bd); }
    </style>
</head>
<body>

<div id="welcome">
    <div class="gl"></div>
    <div class="wc">
        <h1 class="wtitle">JSL VIOLET</h1>
        <button class="wbtn" onclick="startApp()">ENTRER</button>
    </div>
</div>

<div id="app">
    <div class="topbar">
        <div class="logo">NEON PLAYER</div>
        <button class="addbtn" onclick="document.getElementById('fileInput').click()">+ IMPORT</button>
        <input type="file" id="fileInput" hidden multiple accept="audio/*">
    </div>

    <div class="scroll">
        <div class="cwrap">
            <div class="cart">🎵</div>
        </div>
        
        <div class="tinfo">
            <div class="tname" id="curTitle">Aucun titre</div>
            <div class="tartist">Fichier Local</div>
        </div>

        <div id="lyricsDisplay">Appuie sur + pour ajouter tes MP3...<br>Tes sons sont sauvegardés dans ton téléphone.</div>

        <div class="ptrack" id="pRange">
            <div id="pfill"></div>
        </div>

        <div class="ctrls">
            <button class="pbtn" onclick="togglePlay()" id="playBtn">▶</button>
        </div>

        <div class="plsec" id="playlist">
            <!-- Les sons s'afficheront ici -->
        </div>
    </div>
</div>

<audio id="audio"></audio>

<script>
    let db;
    let playlist = [];
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');

    // 1. Initialisation Base de données (IndexedDB)
    const request = indexedDB.open("JSL_Storage", 1);
    request.onupgradeneeded = e => {
        db = e.target.result;
        db.createObjectStore("songs", { keyPath: "id", autoIncrement: true });
    };
    request.onsuccess = e => {
        db = e.target.result;
        loadSongs();
    };

    function startApp() {
        document.getElementById('welcome').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('app').classList.add('on');
        }, 500);
    }

    // 2. Gestion des fichiers
    document.getElementById('fileInput').onchange = async (e) => {
        const files = e.target.files;
        for (let file of files) {
            const songData = {
                name: file.name.replace(/\.[^/.]+$/, ""),
                data: await fileToBlob(file)
            };
            saveToDB(songData);
        }
    };

    function fileToBlob(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.readAsDataURL(file);
        });
    }

    function saveToDB(song) {
        const tx = db.transaction("songs", "readwrite");
        tx.objectStore("songs").add(song);
        tx.oncomplete = () => loadSongs();
    }

    function loadSongs() {
        const listDiv = document.getElementById('playlist');
        listDiv.innerHTML = "";
        const tx = db.transaction("songs", "readonly");
        tx.objectStore("songs").openCursor().onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) {
                const song = cursor.value;
                const item = document.createElement('div');
                item.className = "pli";
                item.innerHTML = `<span>${song.name}</span>`;
                item.onclick = () => playSong(song.data, song.name);
                listDiv.appendChild(item);
                cursor.continue();
            }
        };
    }

    function playSong(src, name) {
        audio.src = src;
        audio.play();
        document.getElementById('curTitle').innerText = name;
        playBtn.innerText = "⏸";
    }

    function togglePlay() {
        if (audio.paused) { audio.play(); playBtn.innerText = "⏸"; }
        else { audio.pause(); playBtn.innerText = "▶"; }
    }

    // Mise à jour barre progression
    audio.ontimeupdate = () => {
        const per = (audio.currentTime / audio.duration) * 100;
        document.getElementById('pfill').style.width = per + "%";
    };

    // Cliquer sur la barre pour avancer le son
    document.getElementById('pRange').onclick = (e) => {
        const rect = e.target.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pos * audio.duration;
    };
</script>
</body>
</html>
