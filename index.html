<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b0015">
    <title>JSL VIOLET PRO</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --bg: #0b0015; --red: #9d50bb; --cyan: #e100ff; --w: #f5f0ff; --mu: #664488; --bd: rgba(157, 80, 187, 0.3); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); font-family: 'Rajdhani', sans-serif; color: var(--w); overflow: hidden; height: 100vh; }

        /* ÉCRAN DE BIENVENUE */
        #welcome { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; background: var(--bg); transition: 0.8s; }
        .gl { position: absolute; inset: 0; background-image: linear-gradient(rgba(157, 80, 187, .1) 1px, transparent 1px), linear-gradient(90deg, rgba(157, 80, 187, .1) 1px, transparent 1px); background-size: 40px 40px; animation: gS 8s linear infinite; }
        @keyframes gS { to { transform: translateY(40px); } }
        .wc { position: relative; text-align: center; z-index: 10; }
        .wtitle { font-family: 'Orbitron'; font-size: 2.5rem; font-weight: 900; background: linear-gradient(135deg, #fff, var(--cyan), var(--red)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .wsub { color: var(--cyan); letter-spacing: 4px; font-size: 0.7rem; margin: 10px 0 30px; text-transform: uppercase; }
        .wbtn { font-family: 'Orbitron'; font-size: .7rem; color: var(--w); border: 1px solid var(--cyan); padding: 15px 40px; background: transparent; cursor: pointer; }

        /* APP PRINCIPALE */
        #app { display: none; width: 100%; height: 100%; flex-direction: column; opacity: 0; }
        #app.active { display: flex; opacity: 1; transition: 0.5s; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid var(--bd); }
        .logo { font-family: 'Orbitron'; font-size: 1rem; color: var(--cyan); }
        .addbtn { background: var(--red); border: none; color: #fff; padding: 8px 15px; border-radius: 2px; font-family: 'Orbitron'; font-size: 0.6rem; cursor: pointer; }

        .scroll { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* DISQUE */
        .cwrap { width: 200px; height: 200px; position: relative; margin: 20px 0; }
        .cart { width: 100%; height: 100%; background: #050010; border-radius: 50%; display: flex; align-items:center; justify-content: center; border: 2px solid var(--red); position: relative; }
        .cart::after { content: ''; width: 50px; height: 50px; background: var(--bg); border: 2px solid var(--cyan); border-radius: 50%; box-shadow: 0 0 15px var(--cyan); }
        .cart.playing { animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .tname { font-family: 'Orbitron'; font-size: 0.9rem; color: var(--w); text-align: center; margin-bottom: 15px; height: 1.2em; }
        
        /* TIMELINE CLIQUABLE */
        .ptrack { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; position: relative; margin-bottom: 20px; }
        #pfill { height: 100%; background: linear-gradient(90deg, var(--red), var(--cyan)); width: 0%; border-radius: 10px; position: relative; pointer-events: none; }
        #pfill::after { content: ''; position: absolute; right: -6px; top: -5px; width: 16px; height: 16px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px var(--cyan); }

        /* CONTRÔLES */
        .ctrls { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
        .cbtn { background: none; border: none; color: var(--mu); font-size: 1.1rem; cursor: pointer; font-family: 'Orbitron'; }
        .cbtn.active { color: var(--cyan); }
        .pbtn { width: 65px; height: 65px; border-radius: 50%; background: var(--red); border: none; color: white; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* VOLUME */
        .v-cont { width: 100%; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .v-lbl { font-family: 'Orbitron'; font-size: 0.5rem; color: var(--mu); border: 1px solid var(--bd); padding: 2px 4px; }
        input[type=range] { flex: 1; accent-color: var(--cyan); }

        /* PLAYLIST */
        .plsec { width: 100%; border-top: 1px solid var(--bd); }
        .pli { padding: 12px; border-bottom: 1px solid rgba(157, 80, 187, 0.1); display: flex; justify-content: space-between; font-size: 0.8rem; cursor: pointer; }
        .pli.active { color: var(--cyan); background: rgba(225, 0, 255, 0.05); }
    </style>
</head>
<body>

<div id="welcome">
    <div class="gl"></div>
    <div class="wc">
        <h1 class="wtitle">JSL VIOLET</h1>
        <p class="wsub">Bienvenue JinStartLine</p>
        <button class="wbtn" onclick="enterApp()">INITIALISER</button>
    </div>
</div>

<div id="app">
    <div class="topbar">
        <div class="logo">NEON PLAYER</div>
        <button class="addbtn" onclick="document.getElementById('fileInput').click()">+ MP3</button>
        <input type="file" id="fileInput" hidden multiple accept="audio/*">
    </div>
    <div class="scroll">
        <div class="cwrap"><div class="cart" id="disk"></div></div>
        <div class="tname" id="curTitle">Prêt...</div>
        <div class="ptrack" id="pRange"><div id="pfill"></div></div>
        <div class="ctrls">
            <button class="cbtn" id="rep" onclick="toggleRepeat()">⟳</button>
            <button class="cbtn" onclick="prevTrack()">|<</button>
            <button class="pbtn" onclick="togglePlay()" id="playBtn">▶</button>
            <button class="cbtn" onclick="nextTrack()">>|</button>
            <button class="cbtn" id="shuf" onclick="toggleShuffle()">⇄</button>
        </div>
        <div class="v-cont">
            <span class="v-lbl">MIN</span>
            <input type="range" min="0" max="1" step="0.1" value="0.8" oninput="audio.volume = this.value">
            <span class="v-lbl">MAX</span>
        </div>
        <div class="plsec" id="playlist"></div>
    </div>
</div>

<audio id="audio"></audio>

<script>
    let db, songs = [], currentIndex = -1, isRepeat = false, isShuffle = false;
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const disk = document.getElementById('disk');

    function enterApp() {
        document.getElementById('welcome').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            setTimeout(() => document.getElementById('app').classList.add('active'), 50);
        }, 800);
    }

    const request = indexedDB.open("JSL_Final_DB", 1);
    request.onupgradeneeded = e => e.target.result.createObjectStore("songs", { keyPath: "id", autoIncrement: true });
    request.onsuccess = e => { db = e.target.result; loadSongs(); };

    document.getElementById('fileInput').onchange = async (e) => {
        for (let file of e.target.files) {
            const songData = { name: file.name.replace(/\.[^/.]+$/, ""), data: await fileToBlob(file) };
            const tx = db.transaction("songs", "readwrite");
            tx.objectStore("songs").add(songData);
            tx.oncomplete = () => loadSongs();
        }
    };

    function fileToBlob(file) { return new Promise(r => { const rd = new FileReader(); rd.onload = e => r(e.target.result); rd.readAsDataURL(file); }); }

    function loadSongs() {
        const listDiv = document.getElementById('playlist');
        listDiv.innerHTML = ""; songs = [];
        db.transaction("songs", "readonly").objectStore("songs").openCursor().onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) {
                songs.push({id: cursor.key, ...cursor.value});
                const item = document.createElement('div');
                item.className = "pli";
                item.id = "song-" + (songs.length - 1);
                item.innerHTML = `<span>${cursor.value.name}</span>`;
                item.onclick = () => playAtIndex(songs.length - 1);
                listDiv.appendChild(item);
                cursor.continue();
            }
        };
    }

    function playAtIndex(index) {
        currentIndex = index;
        audio.src = songs[index].data;
        audio.play();
        document.getElementById('curTitle').innerText = songs[index].name;
        playBtn.innerText = "⏸";
        disk.classList.add('playing');
        document.querySelectorAll('.pli').forEach(el => el.classList.remove('active'));
        document.getElementById('song-'+index).classList.add('active');
    }

    function togglePlay() {
        if (currentIndex === -1 && songs.length > 0) return playAtIndex(0);
        if (audio.paused) { audio.play(); playBtn.innerText = "⏸"; disk.classList.add('playing'); }
        else { audio.pause(); playBtn.innerText = "▶"; disk.classList.remove('playing'); }
    }

    function nextTrack() {
        let n = isShuffle ? Math.floor(Math.random()*songs.length) : currentIndex+1;
        if (n >= songs.length) n = 0;
        playAtIndex(n);
    }

    function prevTrack() {
        let p = currentIndex - 1; if (p < 0) p = songs.length - 1;
        playAtIndex(p);
    }

    function toggleRepeat() { isRepeat = !isRepeat; document.getElementById('rep').classList.toggle('active', isRepeat); }
    function toggleShuffle() { isShuffle = !isShuffle; document.getElementById('shuf').classList.toggle('active', isShuffle); }

    audio.onended = () => isRepeat ? audio.play() : nextTrack();
    audio.ontimeupdate = () => document.getElementById('pfill').style.width = (audio.currentTime/audio.duration)*100 + "%";
    
    document.getElementById('pRange').onclick = (e) => {
        const rect = document.getElementById('pRange').getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    };
</script>
</body>
</html>
